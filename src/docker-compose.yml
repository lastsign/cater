services:
  redis:
    image: redis:alpine
    container_name: redis_server
    command: redis-server --appendonly yes --requirepass "your_secure_password"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  postgres:
    image: postgres:alpine
    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=babufrik
      - POSTGRES_USER=babufrik
      - POSTGRES_PASSWORD=password
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_server
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  redis_data:
  pg_data:
  qdrant_data:
