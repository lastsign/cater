# Debezium Server: WAL of the chunks table -> Kafka -> src/kafka_service/cdc.py -> Qdrant.
# Standalone mode instead of Kafka Connect: there is a single source, a connector cluster is not needed.
# Mounted into the container as /debezium/conf/application.properties.

debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=kafka:29092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.acks=all

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=babufrik
debezium.source.database.password=password
debezium.source.database.dbname=babufrik

# The topic name is built as <topic.prefix>.<schema>.<table> -> cater.public.chunks.
debezium.source.topic.prefix=cater

# pgoutput is built into Postgres 10+, no extra extensions need to be installed.
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=cater_qdrant_sync
debezium.source.publication.name=cater_qdrant_pub
# filtered: publish only the tables we need, not the whole database.
debezium.source.publication.autocreate.mode=filtered

debezium.source.table.include.list=public.chunks
# chunks.text is the chunk body; WAL events do not need it and it would bloat the topic.
debezium.source.column.exclude.list=public.chunks.text

# no_data: schema snapshot without reading existing rows. Historical orphans are
# cleaned up once with `python -m src.kafka_service sweep`, rather than by pumping
# the whole chunks table through Kafka.
debezium.source.snapshot.mode=no_data

# Tombstone after a delete - needed for compaction; the consumer skips them.
debezium.source.tombstones.on.delete=true

# CRITICAL for disk health: if chunks is quiet while the database writes to other
# tables, the slot LSN does not advance and WAL piles up until the disk fills.
# The heartbeat regularly confirms the slot position.
debezium.source.heartbeat.interval.ms=30000

debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=10000

# Flat JSON envelope {before, after, op, source} without Connect schemas inside the message.
debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false

quarkus.log.console.json=false
quarkus.log.level=INFO
