[project]
name = "cater"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<4.0.0"

[dependency-groups]
search = [
    "langchain-qdrant>=1.1.0,<2.0.0"
]

server = [
    "fastapi[standard]>=0.136.3",
    "celery[redis]>=5.6.3",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.50",
    "pydantic>=2.13.4",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.18.4",
    "uvicorn>=0.48.0",
]

worker = [
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.50",
    "httpx>=0.28.1",
    "celery>=5.6.3",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.4",
    "beautifulsoup4>=4.14.3",
    "fastembed>=0.8.0",
    "qdrant-client>=1.18.0",
    "nvidia-cudnn-cu12>=9.22.0.52",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cublas-cu12>=12.9.2.10",
    "onnxruntime-gpu>=1.26.0",
]

embedder = [
    "fastembed>=0.8.0",
    "qdrant-client>=1.18.0"
]

kafka = [
    "confluent-kafka>=2.6.0",
    "aiokafka[lz4]>=0.12.0",
]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.2",
]

[tool.pyright]
# --- what to check ---
include = ["src", "scripts", "main.py"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    ".venv",
    "alembic/versions",   # autogenerated migrations - not our code
    "data",
]

# ============================================================
# ty (Astral) - experimental type checker written in Rust.
# Run:  uvx ty check   (or: uv run ty check)
# Config is separate from pyright's; kept side by side so they can be compared.
# NB: ty is in preview - the settings schema may change between versions.
# ============================================================
[tool.ty.environment]
python-version = "3.13"
python = ".venv"

[tool.ty.src]
include = ["src", "scripts", "main.py"]
exclude = [
    "**/__pycache__",
    ".venv",
    "alembic/versions",
    "data",
]

[tool.ty.terminal]
output-format = "full"    # full | concise
# error-on-warning = true

[tool.ty.rules]
# Values: "error" | "warn" | "ignore".
unresolved-import = "error"
possibly-missing-import = "warn"
unused-ignore-comment = "warn"
# for no stubs (qdrant/fastembed/nvidia/onnx)
redundant-cast = "warn"
